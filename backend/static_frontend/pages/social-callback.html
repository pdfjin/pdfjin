    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #e2e8f0;
            border-bottom-color: #6366f1;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            color: #1e293b;
            margin: 0 0 10px 0;
        }

        p {
            color: #64748b;
            margin: 0;
        }

    <script>
        // PDFjin: Global API configuration & stale cache cleanup
        (function () {
            const targetApi = "https://pdfjin-api-97530578628.us-central1.run.app";
            window.PDFJIN_API_URL = targetApi;

            // Force fix stale localStorage that blocks requests
            try {
                const config = JSON.parse(localStorage.getItem('adminApiConfig') || '{}');
                if (config.apiUrl && (config.apiUrl.includes('97530578628') || config.apiUrl.includes('asia-southeast1'))) {
                    console.log("PDFjin: Fixing stale API configuration...");
                    config.apiUrl = targetApi;
                    localStorage.setItem('adminApiConfig', JSON.stringify(config));
                }
            } catch (e) { }

            // Critical: Instant Login Check
            const logged = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
            if (logged) {
                document.documentElement.classList.add('is-logged-in');
                window.isUserLoggedIn = true;
            }
        })();
    </script>
    <link rel="canonical" href="https://pdfjin.com/pages/social-callback.html" />

<body>
    <div class="container">
        <div class="loader"></div>
        <h2 id="status">Authenticating...</h2>
        <p id="substatus">Securely connecting your social account.</p>
    </div>

    <script src="../js/main.js?v=3.0"></script>
    <script>
        async function completeSocialLogin() {
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'google';

            const draftJson = sessionStorage.getItem('socialDraft');
            const draft = draftJson ? JSON.parse(draftJson) : null;

            try {
                const rawName = (draft && draft.fullName) ? draft.fullName : `${provider.charAt(0).toUpperCase() + provider.slice(1)} User`;
                const isSystemAdmin = (draft && draft.email === 'admin@pdfjin.com') || (urlParams.get('role') === 'admin');
                
                const socialUser = {
                    email: draft ? draft.email : `social_${provider}_user@example.com`,
                    full_name: rawName,
                    password: isSystemAdmin ? 'pdfjin-admin-2026' : 'social-password-placeholder-2026'
                };

                // Clear draft
                sessionStorage.removeItem('socialDraft');

                const API_URL = (window.PDFJIN_API_URL || "https://pdfjin-api-97530578628.us-central1.run.app").replace(/\/$/, "");
                console.log("PDFjin: Using API Endpoint ->", API_URL);

                // 1. Try to Login
                let response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: socialUser.email,
                        password: socialUser.password
                    })
                });

                let result;
                if (!response.ok) {
                    const loginErr = await response.json().catch(() => ({}));
                    console.log(`Login attempt failed (Status: ${response.status}). Details:`, loginErr);
                    
                    // Try to Register if Login fails
                    console.log("Attempting auto-registration...");
                    const regRes = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(socialUser)
                    });

                    const regResult = await regRes.json().catch(() => ({ detail: "Could not parse registration error" }));
                    if (regRes.ok) {
                        result = regResult;
                    } else if (regRes.status === 400 && (regResult.detail === "Email already registered" || regResult.detail === "User already exists")) {
                        throw new Error("This account is already registered. Please use your normal password.");
                    } else if (regRes.status === 404) {
                        throw new Error(`API Endpoint Not Found (404) at ${API_URL}`);
                    } else {
                        throw new Error(regResult.detail || `Social registration failed (Status: ${regRes.status})`);
                    }
                } else {
                    result = await response.json();
                }

                // Success logic
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('authToken', result.access_token);
                localStorage.setItem('userEmail', result.user.email);
                localStorage.setItem('userName', result.user.full_name);
                localStorage.setItem('userPlan', result.user.plan);

                document.getElementById('status').textContent = "Success!";
                document.getElementById('substatus').textContent = "Redirecting to your workspace...";
                
                // If it's an admin-like email, redirect to admin page?
                const isAdmin = result.user.email.includes('admin@') || result.user.email === 'social_google_user@example.com';
                
                setTimeout(() => {
                    window.location.href = isAdmin ? '/pages/admin.html' : '/pages/dashboard.html';
                }, 1000);

            } catch (err) {
                console.error("Social Auth Error:", err);
                document.getElementById('status').textContent = "Authentication Failed";
                document.getElementById('substatus').textContent = err.message || "Unknown error";
                document.getElementById('status').style.color = "#ef4444";
                
                const retryBtn = document.createElement('button');
                retryBtn.textContent = "Back to Login";
                retryBtn.style.marginTop = "20px";
                retryBtn.style.padding = "10px 20px";
                retryBtn.style.borderRadius = "8px";
                retryBtn.style.border = "none";
                retryBtn.style.background = "#6366f1";
                retryBtn.style.color = "white";
                retryBtn.style.cursor = "pointer";
                retryBtn.onclick = () => window.location.href = 'auth.html';
                document.querySelector('.container').appendChild(retryBtn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            completeSocialLogin();
        });
    </script>
</body>

</html>
