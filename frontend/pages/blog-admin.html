<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFjin | Blog Studio</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-premium.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G4FR9CKVZ0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-G4FR9CKVZ0');
    </script>
    <link rel="stylesheet" href="../css/tool-page.css">
    <script>
        // PDFjin: Global API configuration & sync
        (function () {
            window.PDFJIN_API_URL = "https://pdfjin-api-97530578628.us-central1.run.app";
            const logged = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
            if (logged) {
                document.documentElement.classList.add('is-logged-in');
                window.isUserLoggedIn = true;
            }
        })();
    </script>
    <style>
        /* Blog Studio Specific Overrides */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }

        @media (max-width: 992px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .article-preview-card {
            background: #f8fafc;
            border: 1px dashed var(--adm-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }
    </style>
    <link rel="canonical" href="https://pdfjin.com/C:/Users/ADMIN/Desktop/pdfjin/frontend/pages/blog-admin.html" />
</head>

<body class="admin-body">

    <!-- Login Gate -->
    <div id="adminLoginGate" class="login-gate">
        <div class="login-box">
            <div class="login-logo"><span>PDF</span>jin Studio</div>
            <div class="login-subtitle">Content Management System</div>
            <div id="loginError" class="login-error" style="display:none;"></div>
            <div class="login-field">
                <label>Access Password</label>
                <input type="password" id="adminPassInput" placeholder="Enter secure key"
                    autocomplete="current-password">
            </div>
            <button class="login-btn" id="adminLoginBtn" onclick="attemptLogin()">Unlock Studio</button>
        </div>
    </div>

    <!-- Dashboard Layout -->
    <div id="adminDashboard" style="display:none; width: 100%;">

        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="/" class="admin-logo"><span>PDF</span>jin</a>
                <div class="admin-panel-label">BLOG STUDIO</div>
            </div>

            <nav class="admin-nav">
                <a href="admin.html#overview" class="admin-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Main Dashboard</span>
                </a>
                <a href="#blog" class="admin-nav-link active" data-tab="blog">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>Content Manager</span>
                </a>
                <a href="admin.html#settings" class="admin-nav-link" data-tab="settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span>SEO Settings</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <button class="admin-logout-btn" id="adminLogoutBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
                <a href="/" class="back-site-link">&larr; Back to Site</a>
            </div>
        </aside>

        <main class="admin-main">
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <!-- Topbar -->
            <div class="admin-topbar">
                <div class="topbar-left">
                    <button class="mobile-nav-toggle" id="mobileNavToggle" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h2 id="pageTitle">Blog Studio</h2>
                </div>
                <div class="topbar-right">
                    <button class="admin-btn primary" id="btnCreatePost" aria-label="Create new blog article">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Article</span>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <section id="tab-blog" class="admin-tab-content active">
                <div class="admin-card">
                    <div class="card-header">
                        <h2>Published Articles</h2>
                        <div class="search-box" style="padding: 8px 14px; max-width: 250px;">
                            <input type="text" id="blogSearch" placeholder="Filter articles...">
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="blogPostList">
                                <tr>
                                    <td colspan="5" style="text-align:center; padding: 60px; color: var(--adm-muted);">
                                        <div class="spinner" style="margin-bottom:15px"></div>
                                        <div>Initializing Studio...</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="postModal">
        <div class="admin-modal" style="max-width: 1000px; width: 95%;">
            <div class="modal-header">
                <h2 id="modalPostTitle">Compose Article</h2>
                <button class="modal-close" id="closePostModal" aria-label="Close modal"
                    style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--adm-muted)">&times;</button>
            </div>
            <div class="card-body" style="padding: 24px;">
                <form id="blogPostForm">
                    <input type="hidden" id="editPostId">
                    <div class="editor-container">
                        <div class="editor-main">
                            <div class="modal-field">
                                <label>Article Title</label>
                                <input type="text" id="postTitle" placeholder="Enter eye-catching title..."
                                    style="font-size: 1.25rem; font-weight: 700; border-color: var(--adm-primary-soft);">
                            </div>
                            <div class="modal-field">
                                <label>Content (HTML/Markdown)</label>
                                <textarea id="postContent"
                                    style="height: 500px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.6;"
                                    placeholder="Start writing your masterpiece..."></textarea>
                            </div>
                        </div>

                        <div class="editor-side">
                            <div class="modal-field">
                                <label>URL Slug</label>
                                <input type="text" id="postSlug" placeholder="e.g. how-to-merge-pdfs">
                            </div>
                            <div class="modal-field">
                                <label>Category</label>
                                <select id="postTag" class="admin-select" style="width:100%">
                                    <option value="Tutorial">Tutorial</option>
                                    <option value="Security">Security</option>
                                    <option value="Management">Management</option>
                                    <option value="Product">Product Update</option>
                                    <option value="AI Tools">AI Tools</option>
                                </select>
                            </div>
                            <div class="modal-field">
                                <label>Meta Description</label>
                                <textarea id="postMeta" rows="4" placeholder="Brief summary for Google..."></textarea>
                            </div>
                            <div class="modal-field">
                                <label>Icon (Emoji)</label>
                                <input type="text" id="postIcon" value="">
                            </div>
                            <div class="modal-field">
                                <div
                                    style="display: flex; align-items: center; gap: 10px; background: #f1f5f9; padding: 12px; border-radius: 10px;">
                                    <input type="checkbox" id="postStatus" checked style="width: 20px; height: 20px;">
                                    <span
                                        style="font-weight: 700; font-size: 0.9rem; color: var(--adm-text);">Published</span>
                                </div>
                            </div>

                            <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px;">
                                <button type="button" class="admin-btn primary" id="btnSavePost"
                                    style="width:100%; justify-content: center; padding: 14px;">
                                    Publish Article
                                </button>
                                <button type="button" class="admin-btn secondary" id="btnCancelPost"
                                    style="width:100%; justify-content: center;">
                                    Discard Changes
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/admin.js?v=2.2.5"></script>
</body>

</html>
