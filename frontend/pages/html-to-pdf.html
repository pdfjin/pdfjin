    <!-- Ensure core JS can load tasks/limits in the background if needed -->
    <script src="../js/main.js?v=3.3"></script>
    <script>
        const input = document.getElementById('localfileInput');
        const info = document.getElementById('fileInfo');
        const btn = document.getElementById('convertBtn');
        const logBox = document.getElementById('logOutput');
        const picker = document.getElementById('pickerLabel');

        function log(msg, color = '#64748b') {
            const div = document.createElement('div');
            div.style.color = color;
            div.style.padding = '2px 0';
            div.textContent = "> " + msg;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        input.onchange = function () {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                log("File ready: " + file.name, "#1e293b");
                info.innerHTML = `<span>&#128196;</span> <span>${file.name}</span>`;
                info.style.display = 'flex';
                btn.style.display = 'block';
                picker.style.display = 'none';
            }
        };

        btn.onclick = async function () {
            if (!input.files[0]) return;

            if (window.PDFJIN_TASKS && typeof window.PDFJIN_TASKS.isLimitReached === 'function' && window.PDFJIN_TASKS.isLimitReached()) {
                return window.PDFJIN_TASKS.showLimitModal();
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-small"></span> Processing...';
            log("Initializing secure conversion protocol...", "#0369a1");
            const API_URL = window.PDFJIN_API_URL || "https://pdfjin-api-97530578628.us-central1.run.app";

            const fd = new FormData();
            fd.append('files', input.files[0]);

            try {
                log("Uploading to isolated production node...");
                const token = localStorage.getItem('authToken');
                const headers = {};
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(API_URL + "/html-to-pdf", {
                    method: 'POST',
                    headers: headers,
                    body: fd,
                    mode: 'cors'
                });

                if (!res.ok) {
                    if (res.status === 429) {
                        throw new Error("Too many requests. Please wait a moment or sign in for higher limits.");
                    }
                    const errorMsg = await res.text().catch(() => "Unknown error");
                    throw new Error(errorMsg || "API Error " + res.status);
                }

                log("Success! Processing PDF stream...", "#16a34a");
                const blob = await res.blob();
                const dlUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = dlUrl;
                a.download = input.files[0].name.replace(/\.(html|htm)$/i, "") + "_pdfjin.pdf";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                btn.innerHTML = "Success! Done ";
                log("Conversion complete.", "#10b981");

                if (window.PDFJIN_TASKS && window.PDFJIN_TASKS.increment) {
                    window.PDFJIN_TASKS.increment();
                }

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = "Convert to PDF Now &rarr;";
                }, 3000);

            } catch (err) {
                log("Error: " + err.message, "#dc2626");
                btn.disabled = false;
                btn.innerHTML = "Retry conversion";
            }
        };
    </script>
