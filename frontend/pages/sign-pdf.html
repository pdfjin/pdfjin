<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign PDF (Responsive) - PDFjin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G4FR9CKVZ0"></script>
    <style>
        .editor-container {
            margin-top: 2rem;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #f8fafc;
            padding: 1rem;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            position: sticky;
            top: 20px;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .tool-btn.active {
            background: #ee3939;
            color: white;
            border-color: #ee3939;
            box-shadow: 0 4px 12px rgba(238, 57, 57, 0.2);
        }

        .tool-btn.btn-primary {
            background: #ee3939;
            color: white;
            border-color: #ee3939;
        }

        .pages-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            width: 100%;
        }

        .page-container-outer {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .page-wrapper {
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            margin: 0 auto;
            transform-origin: top center;
        }

        @media (max-width: 768px) {
            .tool-container {
                padding-top: 80px;
                padding-bottom: 40px;
            }
            .tool-card {
                padding: 10px 0 !important;
                border-radius: 0;
            }
            .upload-area {
                padding: 1.5rem 0.5rem !important;
            }
            .editor-toolbar {
                padding: 8px;
                gap: 5px;
                top: 10px;
            }
            .tool-btn {
                padding: 6px 10px;
                font-size: 0.8rem;
                gap: 4px;
            }
            .tool-title {
                font-size: 1.5rem;
            }
            .pages-view {
                padding: 0;
            }
        }
    </style>
    <script>
        (function () {
            const targetApi = "https://pdfjin-api-97530578628.us-central1.run.app";
            window.PDFJIN_API_URL = targetApi;
            const logged = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
            if (logged) {
                document.documentElement.classList.add('is-logged-in');
                window.isUserLoggedIn = true;
            }
        })();
    </script>
</head>

<body class="single-file-mode">
    <div style="background: #eff6ff; border-bottom: 1px solid #3b82f6; padding: 10px; text-align: center; font-weight: 700; color: #1e40af; font-size: 0.85rem;">
        📱 Responsive Sign Mode: Documents automatically scale to fit your screen.
    </div>

    <nav class="navbar scrolled">
        <a href="/" class="nav-logo">
            <div class="logo-icon">&#128196;</div>
            PDF<span>jin</span>
        </a>
    </nav>

    <main class="tool-container">
        <div class="section-inner" style="max-width: 1200px; padding: 0;">
            <div class="tool-card shadow-lg" style="max-width: 100%; width: 100%; border-radius: 0;">
                <div class="tool-header">
                    <h1 class="tool-title">Sign PDF</h1>
                    <p class="tool-subtitle">Mobile-friendly signing. Document fits your screen automatically.</p>
                </div>

                <div class="upload-area">
                    <div class="drop-zone" id="dropZone">
                        <p class="drop-zone-text">Upload PDF to sign</p>
                        <input type="file" id="fileInput" class="file-input" accept="application/pdf" />
                    </div>

                    <div id="loadingStatus" style="display: none; text-align: center; padding: 2rem;">
                        <span class="spinner"></span> Opening document...
                    </div>

                    <div id="editorUI" class="editor-container" style="display: none;">
                        <div class="editor-toolbar">
                            <button class="tool-btn btn-primary" id="opensgModalBtn">🖋️ Create signature</button>
                            <span id="activesignHint" style="display:none; font-size: 0.9rem; color: #666; margin-left:10px;">Click on page to place</span>
                            <div style="flex-grow: 1;"></div>
                            <button class="btn-execute" id="executeBtn" style="margin: 0; padding: 8px 20px; font-size: 0.9rem;">Done &rarr;</button>
                        </div>
                        <div id="pageContainer" class="pages-view"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SIGNATURE MODAL -->
    <div id="sgModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3>Signature</h3>
                <button class="btn-ghost" id="closestgModalBtn">&times;</button>
            </div>
            <div class="signature-tabs">
                <div class="signature-tab active" data-target="draw-tab">Draw</div>
                <div class="signature-tab" data-target="saved-tab">Saved</div>
            </div>
            <div id="draw-tab" class="signature-tab-content active">
                <canvas id="signature-pad" style="width:100%; height:200px; touch-action:none; border:1px solid #ddd; border-radius:8px;"></canvas>
                <div class="modal-actions">
                    <button class="btn-ghost" id="clearsgBtn">Clear</button>
                    <button class="btn-primary" id="savesgBtn">Use This</button>
                </div>
            </div>
            <div id="saved-tab" class="signature-tab-content">
                <div id="savedSgsContainer"></div>
                <div id="noSavedSgs" style="display:none;">No saved signatures.</div>
                <button class="btn-primary" id="ussavedsgBtn" style="display:none;">Use selected</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="../js/main.js?v=3.3"></script>
    <script src="../js/sign-pdf.js?v=1.1"></script>
</body>
</html>
