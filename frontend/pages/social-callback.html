<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...  PDFjin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #e2e8f0;
            border-bottom-color: #6366f1;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            color: #1e293b;
            margin: 0 0 10px 0;
        }

        p {
            color: #64748b;
            margin: 0;
        }
    </style>
    <script>
        // PDFjin: Global API configuration & stale cache cleanup
        (function () {
            const targetApi = "https://pdfjin-api-d33mroeryq-as.a.run.app";
            window.PDFJIN_API_URL = targetApi;

            // Force fix stale localStorage that blocks requests
            try {
                const config = JSON.parse(localStorage.getItem('adminApiConfig') || '{}');
                if (config.apiUrl && (config.apiUrl.includes('97530578628') || config.apiUrl.includes('asia-southeast1'))) {
                    console.log("PDFjin: Fixing stale API configuration...");
                    config.apiUrl = targetApi;
                    localStorage.setItem('adminApiConfig', JSON.stringify(config));
                }
            } catch (e) { }

            // Critical: Instant Login Check
            const logged = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
            if (logged) {
                document.documentElement.classList.add('is-logged-in');
                window.isUserLoggedIn = true;
            }
        })();
    </script>
</head>

<body>
    <div class="container">
        <div class="loader"></div>
        <h2 id="status">Authenticating...</h2>
        <p id="substatus">Securely connecting your social account.</p>
    </div>

    <script src="../js/main.js?v=3.0"></script>
    <script>
        async function completeSocialLogin() {
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'google';

            const draftJson = sessionStorage.getItem('socialDraft');
            const draft = draftJson ? JSON.parse(draftJson) : null;

            try {
                const rawName = (draft && draft.fullName) ? draft.fullName : `${provider.charAt(0).toUpperCase() + provider.slice(1)} User`;
                const socialUser = {
                    email: draft ? draft.email : `social_${provider}_user@example.com`,
                    full_name: rawName,
                    password: 'social-password-placeholder-2026'
                };

                // Clear draft
                sessionStorage.removeItem('socialDraft');

                const API_URL = window.PDFJIN_API_URL;

                // 1. Try to Login
                let response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: socialUser.email,
                        password: socialUser.password
                    })
                });

                let result;
                if (!response.ok) {
                    // Try to Register if Login fails
                    console.log("Login failed, attempting auto-registration...");
                    const regRes = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(socialUser)
                    });

                    const regResult = await regRes.json();
                    if (!regRes.ok) {
                        throw new Error(regResult.detail || "Social registration failed");
                    }
                    result = regResult;
                } else {
                    result = await response.json();
                }

                // Success logic
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('authToken', result.access_token);
                localStorage.setItem('userEmail', result.user.email);
                localStorage.setItem('userName', result.user.full_name);
                localStorage.setItem('userPlan', result.user.plan);

                document.getElementById('status').textContent = "Success!";
                document.getElementById('substatus').textContent = "Redirecting to your workspace...";
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (err) {
                console.error("Social Auth Error:", err);
                document.getElementById('status').textContent = "Authentication Failed";
                document.getElementById('substatus').textContent = err.message || "Unknown error";
                document.getElementById('status').style.color = "#ef4444";
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 5000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            completeSocialLogin();
        });
    </script>
</body>

</html>
