name: Auto Blogger Pipeline

on:
  schedule:
    # Runs at 09:00 and 21:00 UTC (Adjust timezones if needed)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  auto-blog-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas markdown bs4

      - name: Run Auto Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_blogger.py

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-blog: Published new post via GitHub Actions" || echo "No changes to commit"
          git push || true

      - name: Trigger Continuous Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering deploy.yml..."
          gh workflow run deploy.yml --ref main


