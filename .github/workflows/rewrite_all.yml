name: Rewrite All Blog Posts

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rewrite-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Rewrite Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python rewrite_all_posts.py

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-blog: Batch rewrote existing posts to follow people-first guidelines" || echo "No changes to commit"
          git push || true

      - name: Trigger Continuous Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering deploy.yml..."
          gh workflow run deploy.yml --ref main
