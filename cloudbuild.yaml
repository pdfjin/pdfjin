steps:
  # 0. Sync frontend to backend to prevent old artifacts from overriding deployments
  - name: 'ubuntu'
    args: ['bash', '-c', 'rm -rf backend/static_frontend && mkdir -p backend/static_frontend && cp -r frontend/* backend/static_frontend/']

  # 1. Build the container image for the backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pdfjin-api', './backend']

  # 2. Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pdfjin-api']

  # 3. Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pdfjin-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pdfjin-api'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--ingress'
      - 'all'
      - '--port'
      - '8080'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--max-instances'
      - '20'
      - '--set-env-vars'
      - 'PORT=8080'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/pdfjin-api'
