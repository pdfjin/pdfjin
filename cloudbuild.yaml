steps:
  # 1. Build the container image for the backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pdfjin-api', './backend']

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pdfjin-api']

  # 3. Deploy the image to Cloud Run with optimized settings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pdfjin-api-d33mroeryq-as'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pdfjin-api'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--ingress'
      - 'all'
      - '--port'
      - '8080'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--max-instances'
      - '20'
      - '--set-env-vars'
      - 'PORT=8080'

images:
  - 'gcr.io/$PROJECT_ID/pdfjin-api'
